services:
  node-runner:
    image: node:20-alpine
    working_dir: /workspace
    volumes:
      - ${POC_RUN_DIR:-./runs}:/workspace:ro
    environment:
      NODE_ENV: production
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 64

  python-runner:
    image: python:3.12-alpine
    working_dir: /workspace
    volumes:
      - ${POC_RUN_DIR:-./runs}:/workspace:ro
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 64

  integration-runner:
    build:
      context: ..
      dockerfile: sandbox/integration/Dockerfile
    working_dir: /workspace
    volumes:
      - ${POC_INTEGRATION_RUN_DIR:-./runs}:/workspace:rw
    environment:
      HOME: /workspace
      NPM_CONFIG_CACHE: /tmp/.npm
      PIP_CACHE_DIR: /tmp/.pip
    network_mode: ${POC_INTEGRATION_NETWORK_MODE:-none}
    read_only: true
    tmpfs:
      - /tmp:size=256m,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1.00
    pids_limit: 128
