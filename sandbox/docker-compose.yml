services:
  node-runner:
    image: node:20-alpine
    working_dir: /workspace
    volumes:
      - ${POC_RUN_DIR:-./runs}:/workspace:ro
    environment:
      NODE_ENV: production
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 64

  python-runner:
    image: python:3.12-alpine
    working_dir: /workspace
    volumes:
      - ${POC_RUN_DIR:-./runs}:/workspace:ro
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 64
